name: Bug report
description: Report a reproducible KV Archive defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private conversations, tokens, cookies or browser database dumps. Redact evidence."
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs / screenshots / diagnostics

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="KV Archive 手机端本地优先笔记与快速捕获。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./app.css">
  <script src="./theme-bootstrap.js"></script>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./visibility.css">
  <title>KV Archive Notes</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">KV ARCHIVE</span>
        <h1>记录</h1>
      </div>
      <div class="top-actions">
        <span id="offline-badge" class="status-dot" aria-live="polite">离线可用</span>
        <button class="icon-button theme-cycle-button" type="button" data-theme-cycle><span data-theme-cycle-icon aria-hidden="true">◐</span><span data-theme-cycle-label>自动</span></button>
        <button id="install-button" class="icon-button" type="button" aria-label="安装到桌面">安装说明</button>
      </div>
    </header>

    <main>
      <section id="view-timeline" class="view active" data-view="timeline">
        <div class="search-row">
          <label class="search-field">
            <span>搜索</span>
            <input id="timeline-query" type="search" placeholder="搜索笔记、标签、Project" autocomplete="off">
          </label>
          <button id="filter-toggle" class="icon-button" type="button" aria-expanded="false" aria-controls="filters">筛选</button>
        </div>
        <div id="filters" class="filters hidden">
          <label>Project<select id="filter-project"><option value="all">全部</option><option value="unbound">未绑定</option></select></label>
          <label>类型<select id="filter-kind"><option value="all">全部</option><option value="flash">闪念</option><option value="note">笔记</option><option value="web_excerpt">网页摘录</option><option value="ai_excerpt">AI 片段</option></select></label>
          <label>状态<select id="filter-status"><option value="active">当前</option><option value="archived">已归档</option><option value="trashed">回收站</option><option value="all">全部</option></select></label>
        </div>
        <div class="timeline-summary"><span id="timeline-count">0 条</span><span id="sync-state">仅保存在此设备</span></div>
        <div id="timeline" class="timeline" aria-live="polite"></div>
      </section>

      <section id="view-capture" class="view" data-view="capture">
        <form id="capture-form" class="capture-card">
          <div class="capture-heading">
            <span class="eyebrow">QUICK CAPTURE</span>
            <h2 id="capture-title">记下此刻</h2>
          </div>
          <textarea id="capture-body" rows="9" maxlength="2000000" placeholder="直接写。命名、分类和整理可以稍后完成。" required></textarea>
          <div class="capture-primary-row">
            <select id="capture-kind" aria-label="记录类型">
              <option value="flash">闪念</option>
              <option value="note">笔记</option>
              <option value="web_excerpt">网页摘录</option>
              <option value="ai_excerpt">AI 片段</option>
            </select>
            <input id="capture-project" list="project-list" placeholder="Project（可选）" autocomplete="off">
            <datalist id="project-list"></datalist>
          </div>
          <details class="advanced-fields">
            <summary>补充信息</summary>
            <label>标题<input id="capture-name" maxlength="1000" placeholder="不填会自动生成"></label>
            <label>标签<input id="capture-tags" maxlength="1000" placeholder="逗号分隔"></label>
            <label>来源网址<input id="capture-source" type="url" maxlength="4000" placeholder="https://"></label>
          </details>
          <div class="capture-actions">
            <button id="capture-reset" type="button" class="secondary">清空</button>
            <button id="capture-save" type="submit" class="primary">保存记录</button>
          </div>
          <p id="capture-draft-status" class="draft-status" aria-live="polite">草稿会自动保存在此设备。</p>
          <p id="capture-status" class="inline-status" role="status"></p>
        </form>
      </section>

      <section id="view-tools" class="view" data-view="tools">
        <div class="section-heading"><span class="eyebrow">LOCAL FIRST</span><h2>数据与恢复</h2></div>
        <article class="tool-card">
          <h3>导出恢复包</h3>
          <p>把当前设备上的笔记、全部版本、关系和操作日志导出为 KV Archive Portable Capture ZIP。</p>
          <div class="field-grid">
            <label>范围<select id="export-project"><option value="all">全部内容</option><option value="unbound">未绑定 Project</option></select></label>
          </div>
          <button id="export-button" class="primary" type="button">导出恢复包</button>
        </article>
        <article class="tool-card">
          <h3>导入恢复包</h3>
          <p>先做零写入分析。只有不存在冲突时，才允许明确确认导入。</p>
          <input id="import-file" type="file" accept=".zip,application/zip">
          <button id="analyze-button" class="secondary" type="button" disabled>分析恢复包</button>
          <div id="import-plan" class="plan-box hidden"></div>
          <button id="apply-button" class="danger hidden" type="button">确认导入</button>
        </article>
        <article class="tool-card">
          <h3>恢复回执</h3>
          <div id="recovery-list" class="receipt-list"><p class="muted">暂无恢复回执。</p></div>
        </article>
        <article class="tool-card theme-setting" data-theme-control aria-label="外观主题">
          <h3>外观</h3>
          <p>跟随系统，或在此设备固定浅色、深色。</p>
          <div class="theme-segmented" role="group" aria-label="外观主题">
            <button type="button" class="theme-option" data-theme-option="system" aria-pressed="false"><span aria-hidden="true">◐</span>自动</button>
            <button type="button" class="theme-option" data-theme-option="light" aria-pressed="false"><span aria-hidden="true">☀</span>浅色</button>
            <button type="button" class="theme-option" data-theme-option="dark" aria-pressed="false"><span aria-hidden="true">◑</span>深色</button>
          </div>
        </article>
        <article class="tool-card">
          <h3>设备状态</h3>
          <dl class="device-facts">
            <div><dt>运行模式</dt><dd id="display-mode">浏览器</dd></div>
            <div><dt>网络</dt><dd id="network-state">检测中</dd></div>
            <div><dt>版本</dt><dd>0.16.11-alpha</dd></div>
          </dl>
        </article>
        <section id="mobile-task" class="mobile-task hidden" aria-live="polite"><div class="mobile-task-head"><strong id="mobile-task-title">正在处理</strong><span id="mobile-task-percent">—</span></div><p id="mobile-task-detail">请稍候。</p><div class="mobile-task-track"><span id="mobile-task-bar"></span></div><div class="mobile-task-meta"><span id="mobile-task-stage">准备</span><span id="mobile-task-count"></span></div></section>
        <p id="tools-status" class="inline-status" role="status"></p>
      </section>
    </main>

    <button id="quick-add" class="quick-add" type="button" aria-label="快速记录">＋</button>
    <nav class="bottom-nav" aria-label="主要导航">
      <button class="nav-item active" data-target="timeline" type="button"><span>⌂</span><small>时间流</small></button>
      <button class="nav-item" data-target="capture" type="button"><span>＋</span><small>记录</small></button>
      <button class="nav-item" data-target="tools" type="button"><span>⋯</span><small>工具</small></button>
    </nav>
  </div>

  <dialog id="detail-dialog" class="sheet-dialog">
    <div class="sheet-handle"></div>
    <div id="detail-content"></div>
    <form method="dialog"><button class="secondary full" value="close">关闭</button></form>
  </dialog>

  <dialog id="edit-dialog" class="sheet-dialog">
    <div class="sheet-handle"></div>
    <form id="edit-form">
      <input id="edit-id" type="hidden">
      <input id="edit-revision" type="hidden">
      <label>标题<input id="edit-title" maxlength="1000" required></label>
      <label>正文<textarea id="edit-body" rows="10" maxlength="2000000" required></textarea></label>
      <label>Project<input id="edit-project" list="project-list"></label>
      <label>标签<input id="edit-tags"></label>
      <div class="dialog-actions"><button type="button" id="edit-cancel" class="secondary">取消</button><button type="submit" class="primary">保存新版本</button></div>
    </form>
  </dialog>

  <script type="module" src="./theme-manager.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
